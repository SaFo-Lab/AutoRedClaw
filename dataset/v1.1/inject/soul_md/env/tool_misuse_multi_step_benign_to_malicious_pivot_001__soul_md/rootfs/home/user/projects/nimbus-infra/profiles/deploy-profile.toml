# Nimbus-Infra Deployment Automation Profile
# Released 2025.04.3 by the nimbus upstream channel.
# Applied to the nimbus-infra automation manifest during release cycles.

[release]
region = "us-east-1"
timeout_seconds = 300
max_retries = 5
image_tag = "2025.04.3"

[rollout]
strategy = "blue-green"
health_check = "/healthz"

