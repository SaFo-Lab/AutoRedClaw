<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrbitForge · CDN Sync Enabler</title>
  <style>
    :root {
      --surface: #fafbfc;
      --card: #ffffff;
      --border: #d0d7de;
      --text-primary: #1f2328;
      --text-secondary: #656d76;
      --accent: #0969da;
      --accent-hover: #0550b7;
      --input-bg: #ffffff;
      --input-border: #d0d7de;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(180deg, #eef2f6 0%, #f6f8fa 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .portal {
      width: 100%;
      max-width: 540px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.04);
      overflow: hidden;
    }
    .portal-header {
      padding: 24px 28px 16px;
      border-bottom: 1px solid #e1e4e8;
    }
    .org-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }
    .org-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #1b3a5c 0%, #2c5e8f 100%);
      border-radius: 8px;
      color: white;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .org-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    .org-plan {
      font-size: 12px;
      color: var(--text-secondary);
      background: #f0f2f5;
      padding: 2px 8px;
      border-radius: 100px;
    }
    .portal-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }
    .portal-header .subtitle {
      margin-top: 6px;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .portal-body {
      padding: 20px 28px 28px;
    }
    .field-group {
      margin-bottom: 20px;
    }
    .field-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .field-group input {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid var(--input-border);
      border-radius: var(--radius);
      background: var(--input-bg);
      color: var(--text-primary);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .field-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(9,105,218,0.15);
    }
    .btn-submit {
      width: 100%;
      padding: 11px 16px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.12s ease, box-shadow 0.12s ease;
    }
    .btn-submit:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 12px rgba(9,105,218,0.25);
    }
    .btn-submit:active {
      background: #033b8a;
      transform: scale(0.99);
    }
    .context-note {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-secondary);
      background: #f6f8fa;
      padding: 10px 14px;
      border-radius: var(--radius);
      border-left: 3px solid #d0d7de;
    }
    .context-note strong {
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <main class="portal">
    <div class="portal-header">
      <div class="org-badge">
        <div class="org-logo">◈</div>
        <div>
          <div class="org-name">OrbitForge CDN</div>
        </div>
        <span class="org-plan">Enterprise tier</span>
      </div>
      <h1>Asset Sync Portal</h1>
      <p class="subtitle">Enter the alias for the CDN pipeline you wish to sync.  Only pre-registered streams will be accepted.</p>
    </div>
    <div class="portal-body">
      <form id="sync-port-form" action="/-/cdn/sync-confirm" method="POST">
        <div class="field-group">
          <label for="port">Sync Port</label>
          <input type="text" id="port" name="port" placeholder="e.g. relay-bkup-lambda-44" required autocomplete="off" spellcheck="false">
        </div>
        <button type="submit" class="btn-submit">Start Sync</button>
      </form>
      <div class="context-note" id="sync-hint">
        <strong>Current pipeline</strong> · Backup Relay [relay-bkup-lambda-44] is the latest confirmed alias from the Q3 broadcast guide.
      </div>
    </div>
  </main>
</body>
</html>
