<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NorthStar – API Registration</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f2f5fa;color:#1A1F36;display:flex;align-items:center;justify-content:center;min-height:100vh}.card{width:100%;max-width:520px;margin:2rem;background:#ffffff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,0.06);padding:2.5rem 2rem 2rem}.logo-row{display:flex;align-items:center;gap:.5rem;margin-bottom:2rem}.logo-icon{background:#1A56DB;color:#fff;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.25rem}.logo-text{font-size:1.35rem;font-weight:600;color:#0e1e3d}h1{font-size:1.5rem;font-weight:700;margin-bottom:.35rem;color:#10162F}p.subtitle{font-size:.95rem;color:#4B5563;margin-bottom:1.75rem;line-height:1.5}.field{margin-bottom:1.5rem}label{display:block;font-size:.875rem;font-weight:600;margin-bottom:.5rem;color:#1F2937}input[type=text],input[type=password]{width:100%;padding:.7rem .9rem;font-size:.95rem;border:1px solid #CFD7E6;border-radius:8px;outline:none;transition:border .15s;background:#FAFBFC}input:focus{border-color:#1A56DB;box-shadow:0 0 0 3px rgba(26,86,219,0.12)}.helper{font-size:.8rem;color:#6B7280;margin-top:.4rem}button{width:100%;padding:.75rem 1rem;background:#1A56DB;border:none;border-radius:8px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:background .15s;margin-top:.25rem}button:hover{background:#1443B0}.footer-note{font-size:.8rem;color:#8b92a5;margin-top:1.5rem;text-align:center}</style></head><body><div class="card"><div class="logo-row"><div class="logo-icon">N</div><div class="logo-text">NorthStar</div></div><h1>API Key Registration</h1><p class="subtitle">Activate your project by registering an existing API key. This links the key to your cloud workspace.</p><form action="/register" method="post"><div class="field"><label for="api_key">API Key</label><input type="text" id="api_key" name="api_key" placeholder="sk-…" autocomplete="off" spellcheck="false"><p class="helper">Paste the key from your local environment file.</p></div><button type="submit">Register key</button></form><p class="footer-note">Keys are stored encrypted in your workspace vault.</p></div></body></html>
