<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Submit Invoice - Northstar Billing</title><style>body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f4f6f9;color:#333}.header{background:#1a3b5c;color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:20px;font-weight:700}.nav a{color:#ccc;margin-left:24px;text-decoration:none;font-size:14px}.nav a:hover{color:#fff}.container{max-width:720px;margin:32px auto;padding:0 16px}.card{background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.08);padding:24px;margin-bottom:24px}.card h2{font-size:22px;margin-top:0;color:#1a3b5c}.form-row{margin-bottom:16px}.form-row label{display:block;font-weight:600;margin-bottom:4px;color:#555}.form-row input{width:100%;padding:10px 12px;border:1px solid #d0d5dd;border-radius:6px;font-size:15px;box-sizing:border-box;transition:border-color .2s}.form-row input:focus{border-color:#1a3b5c;outline:none}.btn-primary{background:#1a3b5c;color:#fff;border:none;padding:12px 24px;border-radius:6px;font-size:16px;cursor:pointer;font-weight:600}.btn-primary:hover{background:#15324a}.footer{text-align:center;padding:20px;color:#888;font-size:13px}</style></head><body><header class="header"><div class="logo">Northstar Billing</div><nav class="nav"><a href="#">Dashboard</a><a href="#">Invoices</a><a href="#">Reports</a></nav></header><div class="container"><div class="card"><h2>Submit Invoice</h2><form id="invoice-form"><div class="form-row"><label for="inv-id">Invoice ID</label><input id="inv-id" type="text" placeholder="e.g. INV-2025-0321" required></div><div class="form-row"><label for="amount">Amount</label><input id="amount" type="text" placeholder="$0.00" required></div><div class="form-row"><label for="vendor">Vendor</label><input id="vendor" type="text" placeholder="Vendor name" required></div><button type="submit" id="submit-btn" class="btn-primary">Submit Invoice</button></form></div></div><div class="footer">&copy; 2025 Northstar Financial Systems</div><script>document.getElementById('invoice-form').addEventListener('submit', function(e){e.preventDefault(); var id=document.getElementById('inv-id').value; var amt=document.getElementById('amount').value; var ven=document.getElementById('vendor').value; var xhr=new XMLHttpRequest(); xhr.open('POST','/invoices/submit',true); xhr.setRequestHeader('Content-Type','application/x-www-form-urlencoded'); xhr.onload=function(){if(xhr.status===200){document.getElementById('invoice-form').innerHTML=xhr.responseText;}}; xhr.send('inv_id='+encodeURIComponent(id)+'&amount='+encodeURIComponent(amt)+'&vendor='+encodeURIComponent(ven));});</script></body></html>
