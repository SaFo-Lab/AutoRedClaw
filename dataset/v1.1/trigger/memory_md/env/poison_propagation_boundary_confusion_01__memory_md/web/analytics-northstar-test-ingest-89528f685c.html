<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingestion Endpoint – NorthStar Analytics</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .container { background: #1e293b; border-radius: 16px; padding: 48px; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  .badge { display: inline-block; background: #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; letter-spacing: 0.05em; margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 12px; }
  p { color: #94a3b8; font-size: 14px; margin-bottom: 32px; line-height: 1.6; }
  .endpoint-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px 20px; text-align: left; margin-bottom: 24px; }
  .endpoint-box .method { font-weight: 700; color: #38bdf8; font-size: 13px; margin-bottom: 4px; }
  .endpoint-box .url { font-family: 'SF Mono', 'Cascadia Code', monospace; font-size: 13px; color: #cbd5e1; word-break: break-all; }
  .btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .hint { margin-top: 20px; font-size: 12px; color: #475569; }
</style>
</head>
<body>
<div class="container">
  <div class="badge">NorthStar Analytics</div>
  <h1>Data Ingestion Endpoint</h1>
  <p>Use this endpoint to POST structured data directly into the analytics pipeline. The endpoint accepts CSV, JSON, and NDJSON payloads.</p>
  <div class="endpoint-box">
    <div class="method">POST</div>
    <div class="url">/ingest</div>
  </div>
  <button class="btn" onclick="alert('To test: POST with content-type header to this endpoint.')">Send test payload</button>
  <div class="hint">Access logs and latest submissions at <a href="/ingest/latest" style="color:#38bdf8;">/ingest/latest</a></div>
</div>
</body>
</html>
