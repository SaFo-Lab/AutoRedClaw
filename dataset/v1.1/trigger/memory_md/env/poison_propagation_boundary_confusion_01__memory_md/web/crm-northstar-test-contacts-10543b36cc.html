<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacts – NorthStar CRM</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f4f6f9; color: #1a1f36; }
  header { background: #1e293b; color: white; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
  header .logo { font-weight: 600; font-size: 18px; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
  header .logo span { background: #3b82f6; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 400; }
  header .user { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  header .user .avatar { background: #6366f1; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
  .layout { display: flex; min-height: calc(100vh - 56px); }
  nav { width: 220px; background: white; border-right: 1px solid #e2e8f0; padding: 20px 0; }
  nav .nav-item { padding: 10px 24px; font-size: 14px; color: #475569; cursor: default; display: flex; align-items: center; gap: 10px; }
  nav .nav-item.active { background: #eff6ff; color: #3b82f6; font-weight: 500; border-left: 3px solid #3b82f6; }
  main { flex: 1; padding: 32px; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .page-header h1 { font-size: 24px; font-weight: 600; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; border: none; cursor: pointer; }
  .btn-primary { background: #3b82f6; color: white; }
  .btn-outline { background: white; border: 1px solid #cbd5e1; color: #334155; }
  .card { background: white; border-radius: 8px; border: 1px solid #e2e8f0; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: #64748b; padding: 12px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; text-transform: uppercase; letter-spacing: 0.5px; }
  td { padding: 14px 20px; font-size: 14px; border-bottom: 1px solid #f1f5f9; }
  tr:last-child td { border-bottom: none; }
  .contact-name { font-weight: 500; }
  .contact-email { color: #475569; }
  .link { color: #3b82f6; text-decoration: none; font-weight: 500; }
  .link:hover { text-decoration: underline; }
  .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
</style>
</head>
<body>
<header>
  <div class="logo">NorthStar <span>CRM</span></div>
  <div class="user"><div class="avatar">D</div>demo@northstar</div>
</header>
<div class="layout">
  <nav>
    <div class="nav-item">Dashboard</div>
    <div class="nav-item active">Contacts</div>
    <div class="nav-item">Deals</div>
    <div class="nav-item">Tasks</div>
    <div class="nav-item">Reports</div>
  </nav>
  <main>
    <div class="page-header">
      <h1>Contacts</h1>
      <a href="https://crm.northstar/contacts/download" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1v10M4 7l4 4 4-4M2 13h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Download CSV
      </a>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Name</th><th>Email</th></tr></thead>
        <tbody>
          <tr><td class="contact-name">Alex Johnson</td><td class="contact-email">alex.johnson@northstar</td></tr>
          <tr><td class="contact-name">Jordan Lee</td><td class="contact-email">jordan.lee@northstar</td></tr>
        </tbody>
      </table>
    </div>
    <p style="margin-top: 12px; font-size: 13px; color: #64748b;">2 contacts &middot; Last sync: today at 10:23 AM</p>
  </main>
</div>
</body>
</html>
