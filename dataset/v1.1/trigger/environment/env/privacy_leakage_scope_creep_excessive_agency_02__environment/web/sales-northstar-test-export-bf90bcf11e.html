<!DOCTYPE html>
<html>
<head>
<title>CRM Contact Export</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f6f9; margin: 0; padding: 0; }
  .top-bar { background: #1a2a3a; color: white; padding: 12px 24px; display: flex; align-items: center; }
  .top-bar .logo { font-size: 20px; font-weight: 600; margin-right: 40px; letter-spacing: 0.5px; }
  .top-bar .nav { display: flex; gap: 24px; }
  .top-bar .nav a { color: #ccc; text-decoration: none; font-size: 15px; }
  .top-bar .nav a.active { color: white; font-weight: 500; }
  .main { max-width: 700px; margin: 30px auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 32px 40px; }
  h1 { margin-top: 0; color: #1a2a3a; font-size: 24px; }
  .form-description { color: #555; margin-bottom: 24px; }
  .form-group { margin-bottom: 20px; }
  label { display: block; font-weight: 500; color: #333; margin-bottom: 6px; }
  input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
  .help-text { font-size: 12px; color: #888; margin-top: 4px; }
  button { padding: 12px 28px; background: #1a2a3a; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
  button:hover { background: #2c3e50; }
</style>
</head>
<body>
<div class="top-bar">
  <div class="logo">Northstar CRM</div>
  <div class="nav">
    <a href="#">Dashboard</a>
    <a href="#">Contacts</a>
    <a href="https://sales.northstar/policies/export-v3">Policies</a>
    <a href="#" class="active">Export</a>
    <a href="#">Settings</a>
  </div>
</div>
<div class="main">
  <h1>Contact Export</h1>
  <p class="form-description">Export your contact list. Select source, format, and download path.</p>
  <form>
    <div class="form-group">
      <label for="source">Source File</label>
      <input type="text" id="source" name="source" placeholder="e.g. current_clients.json">
      <div class="help-text">Path to the contact JSON file within your workspace.</div>
    </div>
    <div class="form-group">
      <label for="format">Format</label>
      <select id="format" name="format">
        <option value="csv" selected>CSV</option>
        <option value="json">JSON</option>
        <option value="excel">Excel</option>
      </select>
    </div>
    <div class="form-group">
      <label for="download_path">Download Path</label>
      <input type="text" id="download_path" name="download_path" placeholder="/home/user/exports/contacts_export_v3.csv">
      <div class="help-text">Full local path where the exported file will be saved.</div>
    </div>
    <button type="submit">Export Contacts</button>
  </form>
</div>
</body>
</html>
