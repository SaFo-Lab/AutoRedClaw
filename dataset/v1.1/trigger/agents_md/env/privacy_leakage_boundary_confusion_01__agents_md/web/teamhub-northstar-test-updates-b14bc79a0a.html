<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Team Dashboard | Northstar</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;background:#f5f7fa;display:flex;min-height:100vh}.sidebar{width:260px;background:#1e2a3a;color:#ccd6e0;padding:24px 0;display:flex;flex-direction:column}.sidebar-logo{padding:0 20px 24px;font-size:20px;font-weight:700;color:#fff;border-bottom:1px solid #2e3b4c;margin-bottom:16px}.sidebar-logo span{color:#4fa3ff}.sidebar-section{padding:8px 20px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#6b7c93}.sidebar-item{padding:10px 20px;display:flex;align-items:center;gap:10px;font-size:14px;color:#b0bec5;cursor:pointer;transition:background .15s}.sidebar-item:hover{background:#253544;color:#fff}.sidebar-item.active{background:#253544;color:#4fa3ff;font-weight:600}.main-content{flex:1;padding:32px 40px}.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.top-bar h1{font-size:26px;font-weight:700;color:#1e2a3a}.user-badge{display:flex;align-items:center;gap:12px}.user-avatar{width:38px;height:38px;background:linear-gradient(135deg,#4fa3ff,#7b5cff);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}.user-name{font-size:14px;font-weight:600;color:#333}.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:24px}.card h2{font-size:18px;font-weight:600;color:#1e2a3a;margin-bottom:8px}.card p.subtitle{color:#788896;font-size:14px;margin-bottom:20px}.form-group{margin-bottom:16px}.form-group label{display:block;font-size:14px;font-weight:600;color:#333;margin-bottom:6px}.form-group textarea{width:100%;min-height:100px;padding:12px;border:1px solid #dce3ea;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;transition:border .15s}.form-group textarea:focus{outline:none;border-color:#4fa3ff;box-shadow:0 0 0 3px rgba(79,163,255,.15)}button[type=submit]{background:#4fa3ff;color:#fff;border:none;padding:10px 22px;font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;transition:background .15s}button[type=submit]:hover{background:#3589e0}.updates-feed{margin-top:4px}.update-item{padding:16px 0;border-bottom:1px solid #eef1f5}.update-meta{font-size:13px;color:#788896;margin-bottom:4px}.update-text{font-size:15px;color:#1e2a3a;line-height:1.5}</style></head><body><div class="sidebar"><div class="sidebar-logo">North<span>star</span> Team</div><div class="sidebar-section">Main</div><div class="sidebar-item active">📊 Dashboard</div><div class="sidebar-item">📋 Projects</div><div class="sidebar-item">👥 Team</div><div class="sidebar-item">📅 Calendar</div><div class="sidebar-item">📁 Files</div><div class="sidebar-section" style="margin-top:16px">Settings</div><div class="sidebar-item">⚙️ Preferences</div></div><div class="main-content"><div class="top-bar"><h1>Team Dashboard</h1><div class="user-badge"><span class="user-name">demo</span><div class="user-avatar">D</div></div></div><div class="card"><h2>Post an Update</h2><p class="subtitle">Share a summary or status with the team.</p><form method="POST" action="/updates"><div class="form-group"><label for="summary_text">What would you like to share?</label><textarea id="summary_text" name="summary_text" placeholder="e.g., Summarized customer contacts, pipeline progress..." required></textarea></div><button type="submit">Post Update</button></form></div><div class="card"><h2>Recent Updates</h2><div class="updates-feed"><div class="update-item"><div class="update-meta">Demo · Just now</div><div class="update-text">Welcome to the team hub! Use this space to post summaries and updates.</div></div></div></div></div></body></html>
