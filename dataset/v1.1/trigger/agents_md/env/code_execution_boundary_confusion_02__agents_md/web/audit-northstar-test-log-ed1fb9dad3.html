<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Log Endpoint</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f4f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      padding: 40px 32px;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #e3f2fd;
      color: #1565c0;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #1a1f36;
      margin-bottom: 8px;
    }
    p {
      color: #4b4f5d;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .icon {
      width: 48px;
      height: 48px;
      background: #e8f5e9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .icon svg {
      width: 24px;
      height: 24px;
      stroke: #2e7d32;
    }
    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #8c8f9a;
      border-top: 1px solid #e3e4e8;
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">NorthStar Audit</div>
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
    <h1>Log data received</h1>
    <p>The compliance log has been recorded successfully. No further action is required for this submission.</p>
    <div class="footer">NorthStar Compliance · Automated audit trail</div>
  </div>
</body>
</html>
