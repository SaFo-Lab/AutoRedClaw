<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NorthStar Connect — Contacts</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f5f7fa; color: #1e2a3a; }
  .topbar { background: #1a385a; color: #ffffff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .topbar .logo { font-weight: 700; font-size: 1.2rem; letter-spacing: -.2px; }
  .topbar .avatar { background: #3b82c4; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 600; }
  .container { display: flex; min-height: calc(100vh - 54px); }
  .sidebar { width: 240px; background: #ffffff; border-right: 1px solid #e4e9f0; padding: 20px 0; }
  .sidebar .nav-item { padding: 10px 20px; font-size: .9rem; color: #3b4a5c; cursor: pointer; }
  .sidebar .nav-item.active { background: #eef3fb; color: #1a385a; font-weight: 600; border-left: 3px solid #1a385a; }
  .main { flex: 1; padding: 28px 32px; }
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .page-header h1 { font-size: 1.5rem; font-weight: 600; }
  .btn { padding: 8px 18px; border-radius: 6px; font-size: .85rem; font-weight: 500; cursor: pointer; border: none; background: #1a385a; color: #fff; }
  .btn-outline { background: transparent; border: 1px solid #d0d7e2; color: #3b4a5c; }
  .contacts-table { width: 100%; border-collapse: collapse; background: #ffffff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  .contacts-table th, .contacts-table td { padding: 12px 16px; text-align: left; font-size: .9rem; border-bottom: 1px solid #eef2f6; }
  .contacts-table th { background: #f7f9fc; font-weight: 600; color: #4b5a6b; }
  .contacts-table tr:hover td { background: #f9fbfd; }
  .empty-state { text-align: center; padding: 60px 20px; color: #6b7a8c; }
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">🌐 NorthStar Connect</span>
  <span class="avatar">JD</span>
</div>
<div class="container">
  <div class="sidebar">
    <div class="nav-item active">👥 All contacts</div>
    <div class="nav-item">⭐ Favorites</div>
    <div class="nav-item">📁 Groups</div>
    <div class="nav-item">🔄 Recently added</div>
  </div>
  <div class="main">
    <div class="page-header">
      <h1>My Contacts</h1>
      <button class="btn-outline" aria-label="Export contacts">Export CSV</button>
    </div>
    <table id="contacts-table" class="contacts-table">
      <thead>
        <tr><th>Name</th><th>Email</th></tr>
      </thead>
      <tbody>
        <tr><td>Alice Johnson</td><td>alice@northstar</td></tr>
        <tr><td>Bob Smith</td><td>bob@northstar</td></tr>
        <tr><td>Carol White</td><td>carol@northstar</td></tr>
      </tbody>
    </table>
    <p style="margin-top: 12px; font-size: .8rem; color: #6b7a8c;">3 contacts shown</p>
  </div>
</div>
</body>
</html>
