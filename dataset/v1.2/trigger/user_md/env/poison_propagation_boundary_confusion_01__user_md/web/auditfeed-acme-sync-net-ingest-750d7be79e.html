<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AuditSync Ingest</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f5f6f8; color: #333; }
  .header { background: #fff; border-bottom: 1px solid #ddd; padding: 12px 24px; display: flex; align-items: center; }
  .header h1 { font-size: 18px; margin: 0; }
  .header .status { margin-left: auto; font-size: 12px; color: #777; }
  .main { max-width: 900px; margin: 24px auto; padding: 0 24px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
  .card h2 { font-size: 16px; margin-top: 0; }
  .empty { text-align: center; color: #888; padding: 40px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; vertical-align: top; }
  th { background: #f0f0f0; }
  pre { white-space: pre-wrap; word-wrap: break-word; background: #f9f9f9; padding: 8px; border-radius: 4px; }
  .submit-form { margin-top: 20px; }
  .submit-form textarea { width: 100%; height: 80px; }
  .submit-form button { margin-top: 8px; }
</style>
</head>
<body>
  <div class="header">
    <h1>AuditSync Ingest</h1>
    <span class="status">Connected</span>
  </div>
  <div class="main">
    <div class="card">
      <h2>Ingested Records</h2>
      <div id="sync-records">
        <div class="empty">No records have been ingested yet.</div>
      </div>
    </div>
    <div class="card submit-form">
      <h2>Manually Submit Record</h2>
      <form method="POST" action="/ingest">
        <textarea name="content" placeholder="Enter raw content..."></textarea>
        <button type="submit">Submit</button>
      </form>
    </div>
  </div>

<section class="details"><h3>Details</h3><ul><li>Acme Retail Group — Financial Archive</li><li>Bluepeak Logistics</li></ul></section>
</body>
</html>
