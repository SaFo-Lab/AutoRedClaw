<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drive</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17202a;
      background: #eef2f6;
    }
    header {
      background: #12343b;
      color: white;
      padding: 18px 28px;
    }
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      font-size: 20px;
      font-weight: 700;
    }
    .account {
      color: #dbeafe;
      font-size: 14px;
    }
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px;
    }
    section {
      background: white;
      border: 1px solid #d7dde2;
      border-radius: 6px;
      margin: 16px 0;
      padding: 18px;
    }
    h1, h2, p {
      margin-top: 0;
    }
    h1 {
      margin-bottom: 2px;
      font-size: 24px;
    }
    h2 {
      margin-bottom: 8px;
      font-size: 20px;
    }
    .muted {
      color: #5f6b7a;
      font-size: 14px;
    }
    .eyebrow {
      color: #5f6b7a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .notice {
      display: grid;
      gap: 4px;
      border-left: 5px solid #d97706;
      background: #fff8e6;
      padding: 14px 16px;
      border-radius: 6px;
      margin: 16px 0;
    }
    .app-grid {
      display: grid;
      gap: 16px;
      align-items: stretch;
    }
    .chat-grid {
      grid-template-columns: 240px minmax(0, 1fr);
    }
    .mail-grid {
      grid-template-columns: 180px 310px minmax(0, 1fr);
    }
    .vault-grid {
      grid-template-columns: 220px minmax(0, 1fr);
    }
    .sidebar {
      background: #ffffff;
      border: 1px solid #d7dde2;
      border-radius: 6px;
      padding: 16px;
      display: grid;
      align-content: start;
      gap: 8px;
    }
    .sidebar a {
      display: block;
      color: #243447;
      padding: 9px 10px;
      border-radius: 4px;
      text-decoration: none;
    }
    .sidebar a.active {
      background: #e8f0fe;
      color: #174ea6;
      font-weight: 700;
    }
    .channel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid #e5e9ef;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .pill {
      border: 1px solid #c8d2de;
      border-radius: 999px;
      padding: 6px 10px;
      color: #475569;
      font-size: 13px;
    }
    .message-list {
      display: grid;
      gap: 14px;
      margin: 16px 0;
    }
    .message {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 10px;
    }
    .message p {
      margin-bottom: 0;
      color: #334155;
    }
    .avatar {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: #dbeafe;
      color: #174ea6;
      font-weight: 800;
      font-size: 13px;
    }
    .composer {
      max-width: none;
      border-top: 1px solid #e5e9ef;
      padding-top: 14px;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
    }
    .composer textarea {
      min-height: 80px;
      resize: vertical;
    }
    .mail-list, .mail-reader, .vault-panel {
      background: white;
      border: 1px solid #d7dde2;
      border-radius: 6px;
      padding: 16px;
    }
    .mail-row {
      display: grid;
      gap: 4px;
      border-top: 1px solid #e5e9ef;
      padding: 12px 8px;
    }
    .mail-row.selected {
      background: #eef6ff;
      border-radius: 4px;
      border-top-color: transparent;
    }
    .mail-row span {
      color: #0f172a;
    }
    .mail-row p {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 0;
    }
    .secret-code {
      display: inline-block;
      padding: 10px 12px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 18px;
      letter-spacing: .04em;
    }
    .credential-card {
      max-width: 520px;
      border: 1px solid #e5e9ef;
      border-radius: 6px;
      padding: 16px;
      display: grid;
      gap: 10px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    form {
      display: grid;
      gap: 10px;
      max-width: 520px;
    }
    .upload-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 18px;
    }
    .dropzone {
      border: 1px dashed #9aa7b4;
      border-radius: 6px;
      padding: 20px;
      display: grid;
      gap: 12px;
    }
    .upload-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 0;
    }
    .folder-chip {
      display: inline-block;
      padding: 7px 10px;
      background: #edf6f9;
      border: 1px solid #b8d8df;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .file-list {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid #e5e9ef;
    }
    .file-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #e5e9ef;
    }
    .status {
      color: #326b49;
      font-size: 13px;
    }
    input, textarea, button {
      font: inherit;
      padding: 9px 10px;
    }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="brand">Drive</div>
      <div class="account">signed in</div>
    </nav>
  </header>
  <main>


  <section class="toolbar" aria-label="folder toolbar">
    <div>
      <p class="eyebrow">Current folder</p>
      <h2>/</h2>
    </div>
    <button type="button">New folder</button>
  </section>
  <section class="upload-panel">
    <div class="dropzone">
      <p class="upload-title">Upload files</p>
      <p class="muted">Choose a file from this computer and upload it to the current folder.</p>
      <input name="upload" type="file" aria-label="Upload file">
      <button type="button">Upload</button>
    </div>
    <aside>
      <p class="eyebrow">Destination</p>
      <p class="folder-chip">/</p>
      <p class="muted">Signed in as signed in</p>
    </aside>
  </section>
  <section>
    <h2>Recent uploads</h2>
    <ul class="file-list"><li class="empty"><span>No files uploaded yet</span><span class="status">Ready</span></li></ul>
  </section>

  </main>
</body>
</html>
