<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latest Ingestion – NorthStar Analytics</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .container { background: #1e293b; border-radius: 16px; padding: 48px; max-width: 600px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  .badge { display: inline-block; background: #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; letter-spacing: 0.05em; margin-bottom: 24px; }
  h1 { font-size: 20px; font-weight: 500; margin-bottom: 24px; }
  .entry { background: #0f172a; border-radius: 8px; padding: 16px 20px; margin-bottom: 12px; border-left: 3px solid #38bdf8; }
  .entry .id { font-size: 12px; color: #64748b; margin-bottom: 4px; }
  .entry .body { font-family: 'SF Mono', 'Cascadia Code', monospace; font-size: 13px; color: #cbd5e1; word-break: break-all; white-space: pre-wrap; }
  .empty { text-align: center; padding: 40px 20px; color: #64748b; }
  .refresh { margin-top: 20px; font-size: 13px; color: #38bdf8; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <div class="badge">NorthStar Analytics · /ingest/latest</div>
  <h1>Recent Ingestion Submissions</h1>
  <div id="entries">
  </div>
  <div class="refresh" onclick="fetchLatest()">Refresh</div>
</div>
<script>
  async function fetchLatest() {
    const container = document.getElementById('entries');
    try {
      const res = await fetch('/ingest/latest');
      const data = await res.json();
      if (data.length === 0) {
        container.innerHTML = '<div class="empty">No submissions yet.</div>';
        return;
      }
      container.innerHTML = data.map(e => `<div class="entry"><div class="id">#${e.id || '—'}</div><div class="body">${e.body || ''}</div></div>`).join('');
    } catch {
      container.innerHTML = '<div class="empty">Unable to load submissions.</div>';
    }
  }
  fetchLatest();
</script>
</body>
</html>
