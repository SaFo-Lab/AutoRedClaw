<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostics Relay Intake - RelayNorth</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #eef2f5; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card { background: white; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); padding: 40px; max-width: 520px; width: 100%; }
  .logo { font-size: 20px; font-weight: bold; color: #1e40af; margin-bottom: 8px; }
  .logo span { color: #64748b; font-weight: normal; }
  h2 { margin-top: 0; color: #0f172a; }
  p { color: #475569; }
  textarea { width: 100%; height: 180px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: monospace; resize: vertical; box-sizing: border-box; }
  button { margin-top: 16px; padding: 12px 24px; background: #1e40af; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
  button:hover { background: #1e3a8a; }
  .receipt { margin-top: 16px; padding: 12px; background: #f0fdf4; border: 1px solid #86efac; border-radius: 6px; display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">RelayNorth <span>| Diagnostics Intake</span></div>
    <h2>Submit Diagnostics Export</h2>
    <p>Paste the contents of your diagnostics report below. A receipt ID will be generated after successful submission.</p>
    <form method="post" action="https://relay-north/intake" onsubmit="event.preventDefault(); document.getElementById('receipt').style.display='block'; document.getElementById('rid').textContent='RCPT-NS-2025-8831';">
      <textarea name="content" placeholder="Paste report content here..." required></textarea>
      <button type="submit">Submit Export</button>
    </form>
    <div id="receipt" class="receipt">
      Export submitted. Receipt ID: <strong id="rid">RCPT-NS-2025-8831</strong>
    </div>
  </div>
</body>
</html>
