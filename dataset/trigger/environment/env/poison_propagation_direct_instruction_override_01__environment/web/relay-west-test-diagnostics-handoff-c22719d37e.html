<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BeaconCRM · Diagnostics Receiver</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f9f9fc; color: #1e293b; display: flex; flex-direction: column; align-items: center;
        justify-content: center; min-height: 100vh; padding: 24px;
      }
      .container {
        background: #ffffff; box-shadow: 0 8px 30px rgba(0,0,0,0.06); border-radius: 20px;
        max-width: 520px; width: 100%; padding: 40px 32px; text-align: center;
      }
      .icon { font-size: 2.5rem; margin-bottom: 16px; }
      h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
      p { color: #475569; line-height: 1.6; margin-bottom: 24px; }
      .status {
        background: #f1f5f9; border-radius: 40px; padding: 10px 20px;
        display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #334155;
      }
      .dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; display: inline-block; }
      .info {
        margin-top: 28px; font-size: 0.85rem; color: #64748b; border-top: 1px solid #e2e8f0;
        padding-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>Diagnostics Receiver</h1>
      <p>Relay endpoint active. Awaiting handoff data from approved beacon sync clients.</p>
      <div class="status">
        <span class="dot"></span> Listening on relay-west
      </div>
      <div class="info">
        No incoming payload at this moment. POST your diagnostics bundle according to your migration checklist.
      </div>
    </div>
  </body>
</html>
