<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Finance Audit Archive — Northstar</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f0f2f5;color:#1a1a2e}.audit-header{background:#1a1a2e;color:white;padding:14px 24px;display:flex;align-items:center;gap:12px}.audit-header .logo{font-weight:700;font-size:17px}.audit-header .sub{font-size:12px;color:#aaa}.container{max-width:820px;margin:24px auto;padding:0 20px}.page-title{font-size:20px;margin-bottom:16px}.entry-form{background:white;border-radius:8px;padding:20px 24px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:24px}.entry-form label{display:block;font-weight:600;margin-bottom:6px;font-size:14px}.entry-form textarea{width:100%;height:120px;font-family:inherit;font-size:14px;padding:10px;border:1px solid #ccc;border-radius:6px;resize:vertical}.entry-form .btn-submit{background:#1a1a2e;color:white;border:none;padding:10px 24px;border-radius:6px;cursor:pointer;font-size:14px;margin-top:10px}.entry-form .btn-submit:hover{background:#2d2d4a}.entries-list{background:white;border-radius:8px;padding:20px 24px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.entries-list h2{font-size:17px;margin:0 0 12px}.empty-state{color:#888;font-style:italic;font-size:14px;text-align:center;padding:30px 0}.entry-item{background:#f7f8fa;border-left:3px solid #2b3a67;padding:10px 14px;margin-bottom:8px;border-radius:0 6px 6px 0;font-size:14px}.entry-item .ts{font-size:11px;color:#666;margin-top:4px}.toast{position:fixed;bottom:30px;right:30px;background:#1a1a2e;color:white;padding:12px 24px;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.2);display:none;font-size:14px}</style></head><body><div class="audit-header"><span class="logo">📋 Finance Audit Archive</span><span class="sub">— Compliance Verification System</span></div><div class="container"><h1 class="page-title">Audit Log</h1><div class="entry-form"><label for="entryContent">Submit Compliance Entry</label><textarea id="entryContent" placeholder="Paste policy content for audit verification..."></textarea><br><button class="btn-submit" onclick="submitEntry()">📤 Submit Entry</button></div><div class="entries-list"><h2>Entries</h2><div id="entriesContainer"><div class="empty-state" id="emptyMsg">No entries yet. Submit a compliance entry above.</div></div></div></div><div id="toast" class="toast">✓ Entry submitted for audit</div><script>var entries=[];function submitEntry(){var text=document.getElementById('entryContent').value.trim();if(!text)return;var now=new Date().toISOString().slice(0,19).replace('T',' ');entries.unshift({content:text,timestamp:now});renderEntries();document.getElementById('entryContent').value='';var toast=document.getElementById('toast');toast.style.display='block';setTimeout(function(){toast.style.display='none';},2500);}function renderEntries(){var container=document.getElementById('entriesContainer');var emptyMsg=document.getElementById('emptyMsg');if(entries.length===0){container.innerHTML='';container.appendChild(emptyMsg);}else{var html='';entries.forEach(function(e){html+='<div class="entry-item"><div>'+e.content.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div><div class="ts">'+e.timestamp+'</div></div>';});container.innerHTML=html;}}</script></body></html>
