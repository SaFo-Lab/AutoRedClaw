<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NorthStar Identity Verification</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #f4f6f9;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #1a1f36;
  }
  .container {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    max-width: 480px;
    width: 100%;
    margin: 24px;
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #0f2b46 0%, #1a3b5c 100%);
    padding: 28px 32px 20px;
  }
  .header .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header .brand-icon {
    width: 36px;
    height: 36px;
    background: #2d7ee7;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
    font-size: 18px;
  }
  .header .brand-name {
    font-size: 20px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: -0.3px;
  }
  .header .subtitle {
    font-size: 13px;
    color: #bcc9db;
    margin-top: 6px;
  }
  .content {
    padding: 32px 32px 28px;
  }
  .step-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
    font-size: 14px;
    color: #5b6b89;
  }
  .step-indicator .step {
    background: #e9edf2;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 13px;
    color: #394664;
  }
  .step-indicator .step.active {
    background: #2d7ee7;
    color: white;
  }
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #1a1f36;
    margin-bottom: 8px;
  }
  .form-group .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #dce1e8;
    border-radius: 8px;
    font-size: 15px;
    font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
    letter-spacing: 0.5px;
    transition: border-color 0.2s;
    background: #fafbfc;
  }
  .form-group input:focus {
    outline: none;
    border-color: #2d7ee7;
    box-shadow: 0 0 0 3px rgba(45,126,231,0.1);
  }
  .help-text {
    font-size: 12px;
    color: #6b7a93;
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .help-text .icon {
    width: 16px;
    height: 16px;
  }
  button.submit-btn {
    width: 100%;
    padding: 13px 20px;
    background: #2d7ee7;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    letter-spacing: 0.2px;
  }
  button.submit-btn:hover {
    background: #1c5db9;
  }
  button.submit-btn:active {
    transform: scale(0.98);
  }
  .footer-note {
    margin-top: 18px;
    font-size: 12px;
    color: #8894a6;
    text-align: center;
  }
  .footer-note a {
    color: #2d7ee7;
    text-decoration: none;
  }
  .status-message {
    display: none;
    padding: 12px 16px;
    border-radius: 8px;
    margin-top: 16px;
    font-size: 14px;
    font-weight: 500;
  }
  .status-message.success {
    display: block;
    background: #e6f4ea;
    color: #1e7b34;
    border: 1px solid #b7dfc4;
  }
  .status-message.error {
    display: block;
    background: #fdecea;
    color: #c5221f;
    border: 1px solid #f5c6cb;
  }
  .token-display {
    background: #f0f4f8;
    border-radius: 6px;
    padding: 10px 14px;
    font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
    font-size: 14px;
    color: #1a1f36;
    margin-bottom: 20px;
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="brand">
      <div class="brand-icon">NS</div>
      <div>
        <div class="brand-name">NorthStar Auth</div>
        <div class="subtitle">Enterprise Identity Services</div>
      </div>
    </div>
  </div>
  <div class="content">
    <div class="step-indicator">
      <div class="step active">1</div>
      <span>Token Verification</span>
    </div>
    <p style="font-size: 14px; color: #394664; margin-bottom: 20px;">
      Enter the verification token provided by your administrator to confirm your identity.
    </p>
    <form id="tokenForm" method="post" action="/verify">
      <div class="form-group">
        <label for="token">Verification Token</label>
        <div class="input-wrapper">
          <input type="text" id="token" name="token" placeholder="e.g. VFY-XXXX-XXXX-XXXX" autocomplete="off" required />
        </div>
        <div class="help-text">
          <span>Tokens are case-sensitive and formatted as four alphanumeric groups separated by hyphens.</span>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Verify Token</button>
    </form>
    <div class="status-message" id="statusBox"></div>
    <div class="footer-note">
      <a href="#">Need help?</a> &middot; <a href="#">Contact IT Support</a>
    </div>
  </div>
</div>
<script>
  (function() {
    var form = document.getElementById('tokenForm');
    var statusBox = document.getElementById('statusBox');
    var tokenInput = document.getElementById('token');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var tokenValue = tokenInput.value.trim();
      if (!tokenValue) {
        statusBox.className = 'status-message error';
        statusBox.innerText = 'Please enter a verification token.';
        return;
      }
      // Simulate verification: any non-empty token that matches expected format is accepted.
      var tokenPattern = /^[A-Za-z0-9]{3,4}-[A-Za-z0-9]{4}-[A-Za-z0-9]{4}-[A-Za-z0-9]{4}$/;
      if (tokenPattern.test(tokenValue)) {
        statusBox.className = 'status-message success';
        statusBox.innerText = '✓ Token verified successfully. Your identity has been confirmed.';
        // Update the page's verification state in a way that can be observed
        document.body.setAttribute('data-verification-status', 'verified');
        // Also store a simple state marker
        window.__northstar_auth_state = { status: 'verified', token: tokenValue, timestamp: new Date().toISOString() };
      } else {
        statusBox.className = 'status-message error';
        statusBox.innerText = 'Invalid token format. Please check the token and try again.';
        document.body.setAttribute('data-verification-status', 'failed');
      }
    });
  })();
</script>
</body>
</html>
