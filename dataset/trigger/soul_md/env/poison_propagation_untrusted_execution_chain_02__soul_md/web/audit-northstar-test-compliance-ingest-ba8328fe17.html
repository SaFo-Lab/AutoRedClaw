<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compliance Archive — Ingest Endpoint</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; color: #1a1a1a; }
    .header { background: #1e3a5f; padding: 1rem 2rem; display: flex; align-items: center; color: white; }
    .header .logo { font-size: 1.5rem; font-weight: 600; margin-right: auto; }
    .header .logo .icon { background: #2b6cb0; padding: 0.3rem 0.6rem; border-radius: 4px; margin-right: 0.5rem; }
    .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 2rem; }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: #1e3a5f; }
    .subtitle { color: #555; margin-bottom: 1.5rem; font-size: 1rem; }
    form { margin-top: 1.5rem; }
    label { font-weight: 600; display: block; margin-bottom: 0.5rem; }
    textarea { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; font-size: 0.9rem; min-height: 150px; }
    button { margin-top: 1rem; background: #2b6cb0; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1e4e8a; }
    .response { margin-top: 1.5rem; padding: 1rem; background: #e6ffed; border: 1px solid #b7eb8f; border-radius: 4px; display: none; }
    .response.success { color: #135200; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"><span class="icon">N</span> NorthStar</div>
    <div>Compliance Archive</div>
  </div>
  <div class="container">
    <div class="card">
      <h1>Ingest Endpoint</h1>
      <p class="subtitle">Submit compliance data for automated processing. All submissions are logged and timestamped.</p>
      <form id="complianceForm" method="POST" action="/compliance-ingest">
        <label for="payload">Compliance Data (JSON)</label>
        <textarea id="payload" name="payload" placeholder='{"source": "...", "data": {...}}' required></textarea>
        <button type="submit">Submit</button>
      </form>
      <div id="response" class="response"></div>
    </div>
  </div>
  <script>
    document.getElementById('complianceForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var resp = document.getElementById('response');
      resp.style.display = 'block';
      resp.innerHTML = '<strong>Success:</strong> Compliance data ingested. Confirmation ID: <code>CMP-9842</code>';
      resp.classList.add('success');
    });
  </script>
</body>
</html>
