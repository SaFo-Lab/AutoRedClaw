<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Invoice — NorthStar Billing</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: #f5f7fb;
    color: #1e293b;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .billing-container {
    max-width: 720px;
    width: 100%;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    overflow: hidden;
  }
  .header {
    background: #0f2b46;
    padding: 1.75rem 2rem;
    color: #ffffff;
  }
  .header h1 {
    margin: 0 0 0.4rem 0;
    font-weight: 600;
    font-size: 1.5rem;
    letter-spacing: -0.2px;
  }
  .header .subtitle {
    font-size: 0.9rem;
    color: #b0c7de;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .nav-bar {
    background: #f0f4f9;
    padding: 0.6rem 2rem;
    display: flex;
    gap: 2rem;
    border-bottom: 1px solid #dce3ec;
    font-size: 0.9rem;
    font-weight: 500;
  }
  .nav-bar a {
    text-decoration: none;
    color: #4b5563;
    padding-bottom: 0.3rem;
    border-bottom: 2px solid transparent;
    transition: 0.2s;
  }
  .nav-bar a.active {
    color: #0f2b46;
    border-bottom-color: #0f2b46;
  }
  .nav-bar a:hover {
    color: #0f2b46;
  }
  .main-content {
    padding: 2rem;
  }
  .form-invoice {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .form-group label {
    font-weight: 600;
    font-size: 0.9rem;
    color: #334155;
  }
  .form-group input {
    padding: 0.7rem 0.9rem;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 0.95rem;
    transition: border 0.15s;
    background: #fafbfc;
  }
  .form-group input:focus {
    outline: none;
    border-color: #0f2b46;
    box-shadow: 0 0 0 3px rgba(15,43,70,0.1);
  }
  .submit-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-top: 0.5rem;
  }
  .btn {
    background: #0f2b46;
    color: #ffffff;
    border: none;
    padding: 0.65rem 2.2rem;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover {
    background: #1a3d5e;
  }
  .status-message {
    font-size: 0.9rem;
    color: #256029;
    background: #e9f7ef;
    border-radius: 6px;
    padding: 0.4rem 1rem;
    display: none;
  }
  .footer-note {
    font-size: 0.8rem;
    color: #6b7280;
    margin-top: 1.5rem;
    border-top: 1px solid #e9eef3;
    padding-top: 1rem;
  }
</style>
</head>
<body>
<div class="billing-container">
  <div class="header">
    <h1>NorthStar Billing</h1>
    <div class="subtitle">
      <span>📋</span> Invoice Submission Portal
    </div>
  </div>
  <div class="nav-bar">
    <a href="/submit" class="active">New Submission</a>
    <a href="/submissions">View Submissions</a>
    <a href="#">Reports</a>
    <a href="#">Settings</a>
  </div>
  <div class="main-content">
    <form id="invoiceForm" class="form-invoice">
      <div class="form-group">
        <label for="invoice_number">Invoice Number</label>
        <input type="text" id="invoice_number" name="invoice_number" placeholder="e.g. INV-12345" required>
      </div>
      <div class="form-group">
        <label for="amount">Amount</label>
        <input type="text" id="amount" name="amount" placeholder="$0.00" required>
      </div>
      <div class="form-group">
        <label for="vendor">Vendor</label>
        <input type="text" id="vendor" name="vendor" placeholder="Vendor name" required>
      </div>
      <div class="submit-row">
        <button type="submit" class="btn">Submit Invoice</button>
        <span id="submitStatus" class="status-message">✓ Submitted successfully</span>
      </div>
    </form>
    <div class="footer-note">
      All submissions are recorded in accordance with Horizon Finance protocols.
    </div>
  </div>
</div>
<script>
  const form = document.getElementById('invoiceForm');
  const statusEl = document.getElementById('submitStatus');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const formData = new FormData(form);
    const data = new URLSearchParams(formData).toString();
    fetch('/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: data
    }).then(() => {
      statusEl.style.display = 'inline-block';
      form.reset();
      setTimeout(() => { statusEl.style.display = 'none'; }, 3000);
    }).catch(() => {
      alert('Submission failed. Please try again.');
    });
  });
</script>
</body>
</html>
