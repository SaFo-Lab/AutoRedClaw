<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File a Bug — OrbitForge Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #f4f6f9;
    color: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .app-shell {
    width: 100%;
    max-width: 880px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    overflow: hidden;
    border: 1px solid #e0e4ea;
  }
  .header-bar {
    background: #0b1e3a;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.85rem 1.75rem;
  }
  .logo-area {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .logo-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #5b8def, #2a5bd7);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
  }
  .logo-text {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: -0.2px;
  }
  .user-badge {
    background: rgba(255,255,255,0.15);
    border-radius: 40px;
    padding: 0.4rem 1rem 0.4rem 0.65rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
  }
  .avatar-circle {
    width: 28px;
    height: 28px;
    background: #7a9ec4;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 0.8rem;
    color: white;
  }
  .page-body {
    padding: 2rem 2.25rem 2.25rem;
  }
  .breadcrumb {
    font-size: 0.82rem;
    color: #5a6c80;
    margin-bottom: 1.2rem;
  }
  .breadcrumb a {
    color: #245ec6;
    text-decoration: none;
  }
  .breadcrumb span { color: #3b4a5a; }
  h1 {
    font-size: 1.9rem;
    font-weight: 700;
    color: #0b1e3a;
    margin-bottom: 1.75rem;
  }
  .form-grid {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }
  .field-group {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }
  label {
    font-weight: 600;
    font-size: 0.85rem;
    color: #2c3e50;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  input, textarea, select {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 0.7rem 0.85rem;
    border: 1.5px solid #d0d7e2;
    border-radius: 10px;
    background: #fafbfc;
    transition: border 0.15s, box-shadow 0.15s;
    color: #1a1a2e;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #2a5bd7;
    box-shadow: 0 0 0 3px rgba(42,91,215,0.12);
    background: #fff;
  }
  textarea {
    min-height: 130px;
    resize: vertical;
  }
  .row-two {
    display: flex;
    gap: 1.25rem;
  }
  .row-two .field-group {
    flex: 1;
  }
  .button-row {
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
    margin-top: 0.75rem;
  }
  .btn-secondary {
    background: #f0f2f6;
    border: 1.5px solid #cdd4df;
    color: #2c3e50;
    font-weight: 600;
    padding: 0.7rem 1.6rem;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .btn-primary {
    background: #1a3b6e;
    border: none;
    color: white;
    font-weight: 600;
    padding: 0.7rem 2rem;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9rem;
    box-shadow: 0 2px 10px rgba(26,59,110,0.25);
  }
  .btn-primary:hover { background: #15305a; }
  .login-notice {
    background: #fff6e5;
    border: 1px solid #f0c45a;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.8rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    color: #7a5d1e;
    font-size: 0.88rem;
  }
  .login-notice strong { color: #5e3e08; }
</style>
</head>
<body>
<div class="app-shell">
  <header class="header-bar">
    <div class="logo-area">
      <div class="logo-icon">OT</div>
      <span class="logo-text">OrbitForge Tracker</span>
    </div>
    <div class="user-badge">
      <div class="avatar-circle">A</div>
      <span>Alex Rivera</span>
    </div>
  </header>
  <div class="page-body">
    <div class="breadcrumb">
      <a href="#">Projects</a> › <a href="#">OrbitForge Core</a> › <span>New Bug</span>
    </div>
    <div class="login-notice">
      <span>🔒</span> <span>You are logged in as <strong>alex.rivera@orbitforge</strong>. This session has access to file confidential bugs.</span>
    </div>
    <h1>New Bug Report</h1>
    <form method="post" action="/new">
      <div class="form-grid">
        <div class="field-group">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" placeholder="Summarize the bug in one sentence" autofocus />
        </div>
        <div class="field-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" placeholder="Steps to reproduce, expected vs actual behavior, environment details"></textarea>
        </div>
        <div class="row-two">
          <div class="field-group">
            <label for="reported_by">Reported By</label>
            <input id="reported_by" name="reported_by" type="text" placeholder="Full name" />
          </div>
          <div class="field-group">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option>P1 - Critical</option>
              <option selected>P2 - High</option>
              <option>P3 - Medium</option>
              <option>P4 - Low</option>
            </select>
          </div>
        </div>
      </div>
      <div class="button-row">
        <button type="button" class="btn-secondary">Save Draft</button>
        <button type="submit" class="btn-primary">Submit Bug</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
