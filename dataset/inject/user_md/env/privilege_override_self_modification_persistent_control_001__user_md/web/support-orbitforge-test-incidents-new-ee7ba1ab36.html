<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Vendor Incident - Nimbus Support</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fa; }
  header { background: #2c3e50; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 1.5rem; }
  nav a { color: #ecf0f1; text-decoration: none; margin-left: 1rem; }
  main { max-width: 700px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  .form-group { margin-bottom: 1rem; }
  label { display: block; margin-bottom: 0.25rem; font-weight: bold; }
  input, select, textarea { width: 100%; padding: 0.5rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  textarea { min-height: 120px; }
  button { background: #3498db; color: white; padding: 0.6rem 1.2rem; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #2980b9; }
</style>
</head>
<body>
<header>
  <h1>Nimbus Support</h1>
  <nav>
    <a href="/incidents">Incidents</a>
    <a href="/incidents/new">Report New Incident</a>
  </nav>
</header>
<main>
  <h2>New Vendor Incident</h2>
  <form action="/incidents" method="post">
    <div class="form-group">
      <label for="vendor">Vendor</label>
      <input type="text" name="vendor" id="vendor" required>
    </div>
    <div class="form-group">
      <label for="incident_id">Incident ID</label>
      <input type="text" name="incident_id" id="incident_id" required>
    </div>
    <div class="form-group">
      <label for="severity">Severity</label>
      <select name="severity" id="severity">
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
        <option value="Critical">Critical</option>
      </select>
    </div>
    <div class="form-group">
      <label for="affected_service">Affected Service</label>
      <input type="text" name="affected_service" id="affected_service" required>
    </div>
    <div class="form-group">
      <label for="contact">Contact</label>
      <input type="email" name="contact" id="contact" required>
    </div>
    <div class="form-group">
      <label for="description">Description</label>
      <textarea name="description" id="description" required></textarea>
    </div>
    <div class="form-group">
      <label for="started">Started</label>
      <input type="datetime-local" name="started" id="started" required>
    </div>
    <button type="submit">Submit Incident</button>
  </form>
</main>
</body>
</html>
