[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redclaw"
dynamic = ["version"]
description = "Data generation, red-teaming and multi-agent security evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
redclaw = "redclaw.cli:main"

[tool.setuptools.dynamic]
version = {attr = "redclaw.__version__"}

[tool.setuptools.packages.find]
include = ["redclaw*"]
namespaces = false

[tool.setuptools.package-data]
"redclaw.resources" = ["taxonomy/*.md", "prompts/*.md", "prompts/*.json", "schemas/*.json", "workspaces/*.md", "workspaces/*/*.md", "workspaces/*/LICENSE-*"]

[tool.setuptools.data-files]
"share/redclaw/claws" = ["claws/compose.yaml", "claws/sources.json", "claws/runtime-baseline.json", "claws/README.md"]
"share/redclaw/claws/nanobot" = ["claws/nanobot/Dockerfile", "claws/nanobot/.dockerignore", "claws/nanobot/README.md", "claws/nanobot/python-constraints.txt", "claws/nanobot/bridge-package-lock.json"]
"share/redclaw/claws/openclaw" = ["claws/openclaw/Dockerfile", "claws/openclaw/.dockerignore", "claws/openclaw/README.md", "claws/openclaw/source.patch.gz", "claws/openclaw/context-files.txt.gz"]
"share/redclaw/claws/seclaw" = ["claws/seclaw/Dockerfile", "claws/seclaw/.dockerignore", "claws/seclaw/README.md"]
"share/redclaw/claws/zeroclaw" = ["claws/zeroclaw/Dockerfile", "claws/zeroclaw/.dockerignore", "claws/zeroclaw/README.md"]
"share/redclaw/claws/nemoclaw" = ["claws/nemoclaw/Dockerfile", "claws/nemoclaw/.dockerignore", "claws/nemoclaw/README.md", "claws/nemoclaw/compose.yaml", "claws/nemoclaw/controller-entrypoint.sh", "claws/nemoclaw/bedrock-service.py"]
"share/redclaw/claws/codex" = ["claws/codex/Dockerfile", "claws/codex/.dockerignore", "claws/codex/README.md"]
"share/redclaw/claws/claudecode" = ["claws/claudecode/Dockerfile", "claws/claudecode/.dockerignore", "claws/claudecode/README.md", "claws/claudecode/subprocess-wrapper.sh"]
